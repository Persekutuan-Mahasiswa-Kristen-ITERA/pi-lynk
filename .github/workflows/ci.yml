name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package-lock.json was written by npm 11. The npm 10 bundled with
      # Node 22 rejects it in `npm ci` (missing optional @emnapi/* entries),
      # so install the same npm major that produced the lockfile.
      - name: Use npm 11
        run: npm install -g npm@11.6.1

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Placeholder values only (no real secrets). The build does not touch
      # the database. It does need network: next/font/google in
      # src/app/layout.tsx downloads fonts from fonts.googleapis.com.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          DATABASE_URL: postgresql://ci:ci@ep-ci-placeholder.us-east-2.aws.neon.tech/ci?sslmode=require
          AUTH_SECRET: ci-placeholder-secret-not-real-0000000000
          AUTH_GOOGLE_ID: ci-placeholder
          AUTH_GOOGLE_SECRET: ci-placeholder
          ADMIN_EMAILS: ci@example.com
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
          RATE_LIMIT_SALT: ci-salt
